<svg xmlns="http://www.w3.org/2000/svg" width="820" height="662" viewBox="0 0 820 662" role="img" aria-label="sporos benchmark results: sporos is fastest in every panel"><title>sporos against copMEM2, MUMmer4, minibwa, BWA, simd-minimizers and minimap2</title><style>.title{font:600 15px system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;fill:#f0efec}.sub{font:400 12.5px system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;fill:#c3c2b7}.name{font:400 13px system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;fill:#c3c2b7}.strong{font-weight:600;fill:#f0efec}.val{font:500 13px system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;fill:#f0efec;font-variant-numeric:tabular-nums}.note{font:400 12.5px system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;fill:#c3c2b7}</style><text x="0" y="22" class="title">MEMs, hg38 vs CHM13 chr1, L = 50</text><text x="0" y="39" class="sub">1 thread, wall time in seconds · lower is better</text><text x="138" y="65" class="name strong" text-anchor="end">sporos</text><path d="M150.0,52.0 H219.3 A4,4 0 0 1 223.3,56.0 V66.0 A4,4 0 0 1 219.3,70.0 H150.0 Z" fill="#3987e5"/><text x="231.30827067669173" y="65" class="val">19.5 s<tspan class="note" dx="10">2.4× faster than copMEM2</tspan></text><text x="138" y="91" class="name" text-anchor="end">copMEM2</text><path d="M150.0,78.0 H320.8 A4,4 0 0 1 324.8,82.0 V92.0 A4,4 0 0 1 320.8,96.0 H150.0 Z" fill="#898781"/><text x="332.812030075188" y="91" class="val">46.5 s</text><text x="138" y="117" class="name" text-anchor="end">MUMmer4</text><path d="M150.0,104.0 H746.0 A4,4 0 0 1 750.0,108.0 V118.0 A4,4 0 0 1 746.0,122.0 H150.0 Z" fill="#898781"/><text x="758.0" y="117" class="val">160 s</text><line x1="150" y1="48" x2="150" y2="126" stroke="#2c2c2a" stroke-width="1"/><text x="0" y="166" class="title">MEMs with 10 threads, same pair</text><text x="0" y="183" class="sub">wall time in seconds (MUMmer4 runs single-threaded) · lower is better</text><text x="138" y="209" class="name strong" text-anchor="end">sporos</text><path d="M150.0,196.0 H188.7 A4,4 0 0 1 192.7,200.0 V210.0 A4,4 0 0 1 188.7,214.0 H150.0 Z" fill="#3987e5"/><text x="200.67241379310346" y="209" class="val">3.3 s<tspan class="note" dx="10">14.1× faster than copMEM2</tspan></text><text x="138" y="235" class="name" text-anchor="end">copMEM2</text><path d="M150.0,222.0 H746.0 A4,4 0 0 1 750.0,226.0 V236.0 A4,4 0 0 1 746.0,240.0 H150.0 Z" fill="#898781"/><text x="758.0" y="235" class="val">46.4 s</text><line x1="150" y1="192" x2="150" y2="244" stroke="#2c2c2a" stroke-width="1"/><text x="0" y="284" class="title">MUMs (-mum), same pair</text><text x="0" y="301" class="sub">1 thread, wall time in seconds · lower is better</text><text x="138" y="327" class="name strong" text-anchor="end">sporos</text><path d="M150.0,314.0 H294.8 A4,4 0 0 1 298.8,318.0 V328.0 A4,4 0 0 1 294.8,332.0 H150.0 Z" fill="#3987e5"/><text x="306.79448909299657" y="327" class="val">21.6 s<tspan class="note" dx="10">4.0× faster than MUMmer4</tspan></text><text x="138" y="353" class="name" text-anchor="end">MUMmer4</text><path d="M150.0,340.0 H746.0 A4,4 0 0 1 750.0,344.0 V354.0 A4,4 0 0 1 746.0,358.0 H150.0 Z" fill="#898781"/><text x="758.0" y="353" class="val">87.1 s</text><line x1="150" y1="310" x2="150" y2="362" stroke="#2c2c2a" stroke-width="1"/><text x="0" y="402" class="title">SMEMs of 1 M 150 bp reads against hg38 chr21, L = 19</text><text x="0" y="419" class="sub">1 thread, wall time in seconds (index built beforehand) · lower is better</text><text x="138" y="445" class="name strong" text-anchor="end">sporos</text><path d="M150.0,432.0 H186.7 A4,4 0 0 1 190.7,436.0 V446.0 A4,4 0 0 1 186.7,450.0 H150.0 Z" fill="#3987e5"/><text x="198.65934065934067" y="445" class="val">1.9 s<tspan class="note" dx="10">4.8× faster than minibwa</tspan></text><text x="138" y="471" class="name" text-anchor="end">minibwa</text><path d="M150.0,458.0 H340.5 A4,4 0 0 1 344.5,462.0 V472.0 A4,4 0 0 1 340.5,476.0 H150.0 Z" fill="#898781"/><text x="352.50549450549454" y="471" class="val">8.8 s</text><text x="138" y="497" class="name" text-anchor="end">bwa fastmap</text><path d="M150.0,484.0 H746.0 A4,4 0 0 1 750.0,488.0 V498.0 A4,4 0 0 1 746.0,502.0 H150.0 Z" fill="#898781"/><text x="758.0" y="497" class="val">27.3 s</text><line x1="150" y1="428" x2="150" y2="506" stroke="#2c2c2a" stroke-width="1"/><text x="0" y="546" class="title">Canonical minimizers, CHM13 chr1, k = 21, w = 11</text><text x="0" y="563" class="sub">1 thread, nanoseconds per base · lower is better</text><text x="138" y="589" class="name strong" text-anchor="end">sporos</text><path d="M150.0,576.0 H182.8 A4,4 0 0 1 186.8,580.0 V590.0 A4,4 0 0 1 182.8,594.0 H150.0 Z" fill="#3987e5"/><text x="194.8421052631579" y="589" class="val">1.05 ns<tspan class="note" dx="10">2.0× faster than simd-minimizers</tspan></text><text x="138" y="615" class="name" text-anchor="end">simd-minimizers</text><path d="M150.0,602.0 H220.7 A4,4 0 0 1 224.7,606.0 V616.0 A4,4 0 0 1 220.7,620.0 H150.0 Z" fill="#898781"/><text x="232.73684210526315" y="615" class="val">2.13 ns</text><text x="138" y="641" class="name" text-anchor="end">minimap2</text><path d="M150.0,628.0 H746.0 A4,4 0 0 1 750.0,632.0 V642.0 A4,4 0 0 1 746.0,646.0 H150.0 Z" fill="#898781"/><text x="758.0" y="641" class="val">17.1 ns</text><line x1="150" y1="572" x2="150" y2="650" stroke="#2c2c2a" stroke-width="1"/></svg>
