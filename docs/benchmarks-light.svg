.0 A4,4 0 0 1 340.5,476.0 H150.0 Z" fill="#898781"/><text x="352.50549450549454" y="471" class="val">8.8 s</text><text x="138" y="497" class="name" text-anchor="end">bwa fastmap</text><path d="M150.0,484.0 H746.0 A4,4 0 0 1 750.0,488.0 V498.0 A4,4 0 0 1 746.0,502.0 H150.0 Z" fill="#898781"/><text x="758.0" y="497" class="val">27.3 s</text><line x1="150" y1="428" x2="150" y2="506" stroke="#e1e0d9" stroke-width="1"/><text x="0" y="546" class="title">Canonical minimizers, CHM13 chr1, k = 21, w = 11</text><text x="0" y="563" class="sub">1 thread, nanoseconds per base · lower is better</text><text x="138" y="589" class="name strong" text-anchor="end">sporos</text><path d="M150.0,576.0 H184.9 A4,4 0 0 1 188.9,580.0 V590.0 A4,4 0 0 1 184.9,594.0 H150.0 Z" fill="#2a78d6"/><text x="196.94736842105263" y="589" class="val">1.11 ns<tspan class="note" dx="10">2.0× faster than simd-minimizers</tspan></text><text x="138" y="615" class="name" text-anchor="end">simd-minimizers</text><path d="M150.0,602.0 H222.1 A4,4 0 0 1 226.1,606.0 V616.0 A4,4 0 0 1 222.1,620.0 H150.0 Z" fill="#898781"/><text x="234.140350877193" y="615" class="val">2.17 ns</text><text x="138" y="641" class="name" text-anchor="end">minimap2</text><path d="M150.0,628.0 H746.0 A4,4 0 0 1 750.0,632.0 V642.0 A4,4 0 0 1 746.0,646.0 H150.0 Z" fill="#898781"/><text x="758.0" y="641" class="val">17.1 ns</text><line x1="150" y1="572" x2="150" y2="650" stroke="#e1e0d9" stroke-width="1"/></svg>
